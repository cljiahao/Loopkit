allowBuilds:
  supabase: true
  esbuild: true
  sharp: true
  unrs-resolver: true
  "@merqo/ui": true

# Security: force-patch transitive advisories. Each entry is scoped to the
# vulnerable range, so it self-clears once a dep ships the patched version.
#   postcss  GHSA-r28c-9q8g-f849  (path traversal via sourceMappingURL; via
#                                  @tailwindcss/postcss, next>postcss, and
#                                  dev: vite<-vitest/stryker-vitest-runner —
#                                  supersedes the narrower <8.5.10 entry this
#                                  replaced, both are the same postcss line)
#   undici   GHSA-*-7.28          (dev: via jsdom<-vitest)
#   vite     GHSA-fx2h/v6wh       (dev: via vitest; 6.4.3 is the first patch)
#   sharp    GHSA-f88m-g3jw-g9cj  (via next>sharp; libvips CVE-2026-33327/33328/35590/35591)
#   fast-uri GHSA-v2hh-gcrm-f6hx (dev: via stryker<-ajv; host confusion via
#                                 literal backslash authority delimiter)
#   brace-expansion — 3 separate advisories affected 3 separate transitive
#   consumers, each naturally on its own major line (minimatch@3.1.5's
#   eslint-internal chain wants 1.x, vitest coverage's glob wants 2.x,
#   stryker's minimatch@10.2.5 wants 5.x). Bounded, same-major-line
#   overrides fixed 2 of 3 cleanly:
#     GHSA-3jxr-9vmj-r5cp (exponential-time expansion) — patched on every
#       major line (>=1.1.16, >=2.1.2, >=5.0.8) — all 3 chains clean.
#     GHSA-mh99-v99m-4gvg (unbounded expansion length OOM) — patched
#       versions are ">=5.0.8" ONLY, no 1.x/2.x backport exists. The 2.x
#       (vitest coverage) and 5.x (stryker) chains already land on 2.1.2/
#       5.0.8 naturally (no override needed) and are clean for this one
#       too. The 1.x (eslint-internal minimatch@3.1.5) chain genuinely
#       cannot be fixed without breaking eslint: forcing it past 1.x
#       broke `pnpm check` outright (`TypeError: expand is not a
#       function` inside minimatch.js — brace-expansion 2.x/5.x isn't a
#       drop-in API match for what that old minimatch build calls), and
#       there's no patched 1.x release to bound-override to instead.
#       Dev-only, no production exposure (ReDoS on attacker-controlled
#       glob patterns fed to eslint, not user input this app ever
#       processes) — accepted until eslint's own dependency chain moves
#       off that old internal minimatch.
overrides:
  postcss@<8.5.18: ">=8.5.18"
  undici@<7.28.0: ">=7.28.0 <8"
  vite@<=6.4.2: ">=6.4.3 <7"
  qs@<6.15.2: ">=6.15.2"
  sharp@<0.35.0: ">=0.35.0"
  fast-uri@<3.1.4: ">=3.1.4"
  brace-expansion@<1.1.16: ">=1.1.16 <2"
